name: Package Local Admin ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-local-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build local-only Admin package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/ExamPrep_Local_Admin
          cp admin.html admin.js admin-auth.js supabase-client.js supabase-question-store.js package/ExamPrep_Local_Admin/
          cat > package/ExamPrep_Local_Admin/README_LOCAL_ADMIN.txt <<'EOF'
          EXAM PREP — LOCAL ADMIN PANEL
          =============================

          PURPOSE
          -------
          This Admin Panel is intended to stay on your own phone/computer.
          Do NOT upload this ZIP or its extracted files to GitHub Pages or another public host.

          CONNECTION
          ----------
          The Admin Panel connects to the same Supabase project as the published Exam Prep User App.
          You need an internet connection when opening the Admin Panel and saving changes.
          Subjects, renamed Subjects, questions, deletions and performance data are written to Supabase.
          The public User App reads that same database, so saved changes are shared automatically.

          OPEN ON ANDROID
          ---------------
          1. Download and extract ExamPrep_Local_Admin.zip into a folder on your phone.
          2. Open the extracted folder and open admin.html in a modern browser.
          3. If your browser blocks JavaScript modules from file://, use a trusted local HTTP-server/preview app to open the folder on localhost.
          4. Keep the phone online because Supabase and PDF.js are loaded over HTTPS.

          ADMIN ACCESS
          ------------
          1. Enter the Admin passcode on the Admin Panel.
          2. After unlock, tap "Exam Prep User App খুলুন".
          3. That link transfers a short-lived Admin session to the published User App in a URL fragment.
             The User App saves the token in its own browser storage and immediately removes it from the address bar.
          4. Do not share the handoff link. It expires after four hours.
          5. Use "Sign out / Lock" in the local Admin Panel to revoke the server session.

          SUBJECT RENAME
          --------------
          Select a Subject, enter its new display name, and tap Rename Subject.
          The Subject ID and slug stay the same, so its existing questions remain attached.

          DATA SAFETY
          -----------
          Destructive actions are permanent:
          - Clear Subject Questions removes MCQs for one Subject.
          - Delete Subject also removes its Chapters, Theory Notes and MCQs.
          - Clear All Questions removes MCQs across every Subject but keeps Subject rows.
          Check the confirmation text carefully before continuing.

          QUESTION IMPORT
          ---------------
          Supports bulk text, JSON, TXT and selectable-text PDFs.
          Scanned/image-only PDFs are not OCR-processed.
          Preview and correct validation errors before saving.

          FILES
          -----
          admin.html                 Admin interface
          admin.js                   Bulk parser, import, rename and delete controls
          admin-auth.js              Passcode unlock and User App handoff
          supabase-client.js         Supabase URL and publishable key
          supabase-question-store.js Shared database adapter

          This ZIP contains no service-role key and no raw Admin passcode.
          EOF
          cd package
          zip -qr ../ExamPrep_Local_Admin.zip ExamPrep_Local_Admin

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamPrep_Local_Admin
          path: ExamPrep_Local_Admin.zip
          if-no-files-found: error
          retention-days: 7
